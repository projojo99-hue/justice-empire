<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUSTICE EMPIRE : Version Exhaustive Cropanzano (2007)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- CHARGEMENT DU FICHIER CASES.JS -->
    <script src="cases.js"></script>
    
    <style>
        body { background-color: #0d051b; color: #f8fafc; font-family: 'Outfit', sans-serif; }
        .stamp-btn { transition: all 0.15s ease; }
        .stamp-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 max-w-4xl mx-auto">

    <header class="text-center py-6 border-b border-purple-800">
        <h1 class="font-pixel text-2xl text-cyan-400">JUSTICE EMPIRE ⚖️</h1>
        <p class="text-xs text-pink-400 mt-2 font-bold">100% de l'article Cropanzano, Bowen & Gilliland (2007)</p>
    </header>

    <main class="mt-6">
        <div id="game-card" class="bg-slate-900 border-2 border-purple-700 rounded-3xl p-6 shadow-2xl">
            <div class="flex justify-between items-center border-b border-purple-800 pb-3 mb-4">
                <span id="case-topic" class="font-pixel text-xs text-amber-400">MODULE</span>
                <span id="case-authors" class="text-xs text-slate-400 font-mono">Auteurs</span>
            </div>

            <p id="case-speech" class="text-base text-slate-100 font-medium mb-6 italic">"Chargement du scénario..."</p>

            <div id="options-container" class="space-y-3">
                <!-- Les choix de cases.js s'injectent ici -->
            </div>

            <div id="feedback-box" class="hidden mt-6 p-4 rounded-xl bg-slate-950 border border-emerald-500">
                <p id="feedback-text" class="text-sm text-emerald-300"></p>
                <button onclick="nextCase()" class="mt-4 px-4 py-2 bg-pink-600 text-white font-pixel text-xs rounded-xl">CAS SUIVANT ➔</button>
            </div>
        </div>
    </main>

    <script>
        let currentIdx = 0;

        function loadCurrentCase() {
            // Vérifie si cases.js est bien chargé
            const caseList = (typeof ALL_ARTICLE_CASES !== 'undefined') ? ALL_ARTICLE_CASES : [];
            
            if (caseList.length === 0) {
                document.getElementById('case-speech').innerText = "Erreur : cases.js n'est pas détecté. Vérifiez que le fichier cases.js est bien dans le même dépôt GitHub !";
                return;
            }

            const c = caseList[currentIdx];
            document.getElementById('case-topic').innerText = c.topic;
            document.getElementById('case-authors').innerText = c.authors;
            document.getElementById('case-speech').innerText = `"${c.speech}"`;
            document.getElementById('feedback-box').classList.add('hidden');

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            c.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "stamp-btn w-full p-4 rounded-xl bg-purple-950 border border-purple-700 text-left text-sm hover:bg-purple-900 transition";
                btn.innerText = opt.text;
                btn.onclick = () => {
                    document.getElementById('feedback-text').innerText = (opt.isCorrect ? "✅ " : "❌ ") + opt.exp;
                    document.getElementById('feedback-box').classList.remove('hidden');
                };
                container.appendChild(btn);
            });
        }

        function nextCase() {
            currentIdx = (currentIdx + 1) % ALL_ARTICLE_CASES.length;
            loadCurrentCase();
        }

        window.onload = loadCurrentCase;
    </script>
</body>
</html>
